name: Release

# Runs when a version tag (v1.1.5 etc.) is pushed. Builds both browsers from src/
# and attaches the store zips to a GitHub Release, so anyone can verify the
# published extension was built from this exact source.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build
        run: node build.mjs --version "${GITHUB_REF_NAME#v}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          mv chrome-extension.zip "buxback-chrome-v$VERSION.zip"
          mv firefox-extension.zip "buxback-firefox-v$VERSION.zip"
          gh release create "$GITHUB_REF_NAME" \
            "buxback-chrome-v$VERSION.zip" \
            "buxback-firefox-v$VERSION.zip" \
            --title "v$VERSION" \
            --generate-notes
